<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Financial Customer Service Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar" aria-label="导航">
        <div class="brand reveal">
          <div class="brand-mark">FA</div>
          <div>
            <p class="eyebrow">Financial Service Desk</p>
            <h1>Customer Service Agent</h1>
          </div>
        </div>

        <section class="sidebar-panel reveal delay-1">
          <div class="section-head">
            <span>Quick prompts</span>
          </div>
          <div class="prompt-list">
            <button type="button" class="prompt-chip" data-prompt="退款政策是什么？">退款政策</button>
            <button type="button" class="prompt-chip" data-prompt="理财产品A的收益率是多少？">产品咨询</button>
            <button type="button" class="prompt-chip" data-prompt="我想创建一个退款工单">创建工单</button>
            <button type="button" class="prompt-chip" data-prompt="开户流程需要准备什么？">开户流程</button>
          </div>
        </section>
      </aside>

      <section class="workspace" aria-label="对话工作区">
        <section class="conversation reveal">
          <div class="conversation-head">
            <h3>金融客服对话台</h3>
            <div class="head-status">
              <span class="status-chip" id="complianceBadge">Idle</span>
              <span class="status-chip muted" id="latencyText">--</span>
            </div>
          </div>

          <div class="chat-log" id="chatLog" aria-live="polite">
            <article class="message assistant">
              <div class="message-mark">AG</div>
              <div class="message-body">
                <p>你好，我可以处理退款、产品咨询、开户问答和工单请求。直接输入问题即可。</p>
              </div>
            </article>
          </div>

          <form class="composer" id="chatForm">
            <label class="sr-only" for="messageInput">输入消息</label>
            <textarea
              id="messageInput"
              rows="1"
              placeholder="输入客户问题，例如：退款政策是什么？"
            ></textarea>
            <button type="submit" id="sendButton" aria-label="发送消息">
              <span>Send</span>
            </button>
          </form>
        </section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
